<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>JobRadar — Настройки</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0e0e10;
      color: #e4e4e7;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 28px;
      color: #e4e4e7;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #a1a1aa;
    }

    input[type="text"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: #1e1e22;
      color: #e4e4e7;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: rgba(255, 255, 255, 0.25);
    }

    input::placeholder {
      color: #52525b;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
    }

    #save-btn {
      padding: 9px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: #22c55e;
      color: #0e0e10;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #save-btn:hover {
      background: #1ea74e;
    }

    #save-btn:active {
      background: #19903f;
    }

    #status {
      font-size: 13px;
      color: #22c55e;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #status.visible {
      opacity: 1;
    }

    .note {
      margin-top: 28px;
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: #71717a;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JobRadar — Настройки</h1>

    <div class="field">
      <label for="endpoint">Адрес бэкенда JobRadar</label>
      <input type="text" id="endpoint" placeholder="http://127.0.0.1:8080">
    </div>

    <div class="field">
      <label for="secret">Секретный ключ расширения</label>
      <input type="password" id="secret" placeholder="Введите ключ">
    </div>

    <div class="actions">
      <button id="save-btn">Сохранить</button>
      <span id="status">Настройки сохранены ✓</span>
    </div>

    <div class="note">
      Если бэкенд на другом адресе — впиши его сюда, и добавь этот адрес
      в <code>manifest.json</code> → <code>host_permissions</code>.
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
